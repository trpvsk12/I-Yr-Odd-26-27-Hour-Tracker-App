const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function niceClass(c){return c.replace(/^I /,'I ').replace(/-(?=[A-Z]$)/,' - ')}
for(const c of DATA.classes){$('classFilter').insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`);$('dirClass').insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`);}
function peopleHtml(fac){if(!fac?.length)return '<div class="dept">Faculty not specified in source timetable.</div>';return fac.map(f=>`<div class="person"><div><div class="name">${esc(f.name||'Faculty')}</div><div class="dept">${esc(f.department)}</div></div>${f.mobile?`<a class="phone" href="tel:${esc(f.mobile)}">${esc(f.mobile)}</a>`:''}</div>`).join('')}
function card(r){return `<article class="card"><div class="top"><div class="class">${esc(niceClass(r.class))}</div><div class="badge">${esc(r.day)} • Hour ${r.hour}</div></div><div class="course">${esc(r.course||r.session)}</div>${r.code?`<div class="code">${esc(r.code)}</div>`:''}${r.session&&r.session!==r.code?`<div class="session">Timetable: ${esc(r.session)}</div>`:''}<div class="faculty">${peopleHtml(r.faculty)}</div></article>`}
function renderSchedule(){const d=$('day').value,h=+$('hour').value,c=$('classFilter').value;const rows=DATA.records.filter(r=>r.day===d&&r.hour===h&&(c==='ALL'||r.class===c));$('summary').textContent=`${rows.length} class${rows.length===1?'':'es'} shown • Complete source coverage`; $('results').innerHTML=rows.map(card).join('')||'<div class="empty">No records found.</div>';}
function dirCard(x){return `<article class="card"><div class="top"><div class="class">${esc(niceClass(x.class))}</div><div class="badge">Course Faculty</div></div><div class="course">${esc(x.course)}</div><div class="code">${esc(x.code)}</div><div class="faculty">${peopleHtml(x.faculty)}</div></article>`}
function renderDirectory(){const c=$('dirClass').value,q=$('search').value.trim().toLowerCase();let rows=DATA.directory.filter(x=>c==='ALL'||x.class===c);if(q)rows=rows.filter(x=>[x.class,x.code,x.course,...x.faculty.flatMap(f=>[f.name,f.department,f.mobile])].join(' ').toLowerCase().includes(q));$('dirSummary').textContent=`${rows.length} course/activity entries`; $('dirResults').innerHTML=rows.map(dirCard).join('')||'<div class="empty">No matching faculty entries.</div>';}
